# --- could not be confirmed (Group C; classification `unconfirmed`) -----------------------------
# Natural assumptions that no applicable source establishes. Never cited as evidence; `related`
# names the item whose field the assumption comes from (shown for context only).
not_confirmed:
  - id: org_signatory_photograph
    ruling: org_signatory_photograph
    title: Photographs of authorised signatories
    scope: opening
    topics: [photograph]
  - id: org_entity_pan_card_copy
    ruling: org_entity_pan_card_copy
    title: A copy of the organisation's PAN card
    scope: opening
    topics: [pan_card_copy]
    related: [org_signatory_pan_number]
  - id: nri_pan_card_copy
    title: A copy of the PAN card
    scope: opening
    categories: [NRI_INDIVIDUAL]
    topics: [pan_card_copy]
    related: [nri_pan_number]
    reason: The form asks for the PAN number. A number field does not establish that a copy of the PAN card has to be submitted, and no applicable HDFC Bank document asks for one (A1 §4 rule 1).
  - id: conv_pan_card_copy
    title: A copy of the PAN card
    scope: conversion
    topics: [pan_card_copy]
    related: [conv_pan_number]
    reason: The conversion form asks for the PAN number. A number field does not establish that a copy of the PAN card has to be submitted, and no applicable HDFC Bank document asks for one (A1 §4 rule 1).

# --- fixed customer-facing wording for checklists (A1 §3, §7, §8) -------------------------------
wording:
  classification_labels:
    policy_supported: Required by HDFC Bank policy
    form_indicated: Asked for on the HDFC Bank form
    unconfirmed: Could not be confirmed
    legacy_reference: Older reference, not confirmed by HDFC Bank
    unknown: Not found in the available documents
  establishes:
    document: The HDFC Bank form asks you to provide this.
    declaration: The HDFC Bank form has this section for you to complete and sign.
    information: The HDFC Bank form has a field for this.
  does_not_establish: >-
    This shows what the form copy asks for. It does not confirm HDFC Bank's current requirements,
    and it does not mean the item is mandatory.
  unconfirmed_explanation: >-
    No applicable HDFC Bank document in the corpus establishes this.
  ocr_warning: Text read automatically from a scanned page; it may contain errors
