# Checklist item catalogue of the HDFC Bank Account Opening Assistant (A4).
#
# What it is: the items each applicable HDFC form asks for, as DATA that cites stored text
# (CLAUDE.md principle 5: no requirement text in code). Every evidence entry names a stored
# chunk (chunks.id), its document and page, and `quote`: text that must occur EXACTLY in the
# stored chunk. The quote is re-checked against Postgres on every checklist build and by the
# integration tests; an item whose evidence fails is dropped, never shown.
#
# What it is not: a classification. Classes are assigned by code from the source role
# (A1 §3): an applicable opening form gives `form_indicated`, nothing here can make an item
# `policy_supported`, and re-KYC / legacy / not-used documents can never be cited (the
# loader refuses them). OCR-uncertain quotes are stored exactly as the OCR read them, to
# verify the citation; they are never shown as verified quotations (A1 §8.2 rule 3a).
#
# Rules enforced by app/assistant/catalogue.py (fail closed):
# - opening items cite only `opening_form` documents, and only for covered cells whose
#   sources include that document; conversion items cite only the `conversion_form`;
# - a `condition` is verbatim source text and occurs in one of the item's quotes;
# - items backed by an A2 item ruling (coverage.yaml `item_rulings`) must match the ruling
#   exactly (kind, categories, condition, cited chunks); every ruling appears here once;
# - `not_confirmed` entries never carry evidence of their own.

version: a4-1
basis: coverage.yaml a2-2 and A1 §3-§8 (owner-approved)

# --- documents, declarations and information (Groups A and B) ----------------------------------
# when: facet constraints (A3 slots). If the profile's value is unknown, the item is shown with
# an "applies if" note; if it is known and different, the item is left out.
# accounts: omitted = every covered account type of the listed categories.
# only_when_asked: shown only when the customer asked about one of its topics.
