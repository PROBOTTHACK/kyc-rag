# Coverage map of the HDFC Bank Account Opening Assistant (A2).
#
# Source of truth: docs/assistant/A0_AUDIT.md §2 (owner-approved 2026-11-14) and A1 §2, §5.
# Rules (enforced by app/assistant/coverage.py and its tests):
# - Only combinations with evidence are listed. ANY combination not listed here is
#   NOT_ESTABLISHED (the prescribed fallback), so no coverage exists by assumption.
# - Every listed cell cites stored chunks (chunks.id; HDFC; checked against Postgres by the
#   integration tests). Multimodal-schema evidence names the schema field and says whether
#   it is corroborated by stored text.
# - Cells may only use `opening_form` (or future `policy`) sources; the conversion intent
#   only the `conversion_form`. Re-KYC (`context`) and the legacy FAQ never create coverage.
# - Changing a cell needs corpus evidence and owner review (CLAUDE.md).

version: a2-1
basis: docs/assistant/A0_AUDIT.md section 2

documents:
  hdfc_nri_account_opening:
    role: opening_form
    title: Account Cum Term Deposit Opening Form for Non Resident - Individual Customers
    categories: [NRI_INDIVIDUAL]
    scanned: false
    date_basis: form copy; PDF created 2019; no printed edition date
  hdfc_non_individual_account_opening:
    role: opening_form
    title: Account Opening Form for Sole Proprietor/HUF/Trust/Firm/Corporate
    categories: [SOLE_PROPRIETORSHIP, PARTNERSHIP_FIRM, LLP, COMPANY, TRUST, HUF, OTHER_ORGANISATION]
    scanned: true
    date_basis: form copy; print code 92713/07.01.2015
  hdfc_resident_to_nro_conversion:
    role: conversion_form
    title: Resident Account to NRO Account Conversion Form for Non Resident - Individual Customers
    categories: [RESIDENT_INDIVIDUAL, NRI_INDIVIDUAL]
    scanned: false
    date_basis: form copy; PDF created 2018; no printed edition date
  hdfc_nri_rekyc:
    role: context
    title: NRI Customer Updation Form for Re-KYC
    categories: [NRI_INDIVIDUAL]
    scanned: true
    date_basis: form copy; print code 93316/05.08.2020
  hdfc_resident_rekyc_dormant:
    role: context
    title: Re-KYC and Dormant Activation form for Resident Individuals
    categories: [RESIDENT_INDIVIDUAL]
    scanned: false
    date_basis: form copy; print code 93317/03.02.2021
  hdfc_kyc_aml_faq:
    role: legacy_reference
    title: Frequently Asked Questions on KYC Norms and Anti Money Laundering (provenance unverified)
    categories: [RESIDENT_INDIVIDUAL, COMPANY, PARTNERSHIP_FIRM, TRUST]
    scanned: false
    date_basis: undated; based on an RBI circular of 29/11/2004; PDF created 2008
  hdfc_netbanking_corporate_application:
    role: not_used
    title: Application for NetBanking facility for Companies / Trusts / Co-Operative Societies / Association of Persons / Clubs
    categories: []
    scanned: false
    date_basis: form copy; footer code company-clubDec06

