# --- why prominent combinations are NOT_ESTABLISHED (explanations only; never coverage) ---------
not_established_reasons:
  - {category: RESIDENT_INDIVIDUAL, account_type: null, reason: "The corpus has no HDFC account opening form or document list for resident individuals; re-KYC material is not account-opening evidence (A0 amendment 2)."}
  - {category: null, account_type: SALARY, reason: "No HDFC document in the corpus covers opening a salary account (the only mention is an NRI-form rule about converting an inactive salary account)."}
  - {category: null, account_type: SAVINGS, reason: "For organisations, the corpus does not establish a savings account: the NRI form states 'Savings account can be opened only by individuals for non-business purposes', and the scanned non-individual form only shows a tick box."}
  - {category: null, account_type: FCNR_RFC, reason: "FCNR / RFC deposits appear only on the NRI individual form."}
