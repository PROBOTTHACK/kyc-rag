# --- covered cells (everything else is NOT_ESTABLISHED) -----------------------------------------
cells:
  # NRI individual: native-text opening form
  - {category: NRI_INDIVIDUAL, account_type: SAVINGS, state: COVERED, sources: [hdfc_nri_account_opening],
     evidence: [*nre_accounts, *nro_accounts],
     facets: [{facet: nri_scheme, evidence: [*nre_accounts, *nro_accounts]},
              {facet: holding, evidence: [*nri_operating]},
              {facet: minor, evidence: [*nri_operating, *nri_guardian]}]}
  - {category: NRI_INDIVIDUAL, account_type: CURRENT, state: COVERED, sources: [hdfc_nri_account_opening],
     evidence: [*nre_accounts, *nro_accounts],
     facets: [{facet: nri_scheme, evidence: [*nre_accounts, *nro_accounts]},
              {facet: holding, evidence: [*nri_operating]},
              {facet: minor, evidence: [*nri_operating, *nri_guardian]}]}
  - {category: NRI_INDIVIDUAL, account_type: FIXED_DEPOSIT, state: COVERED, sources: [hdfc_nri_account_opening],
     evidence: [*nri_term],
     facets: [{facet: nri_scheme, evidence: [*nri_term]},
              {facet: holding, evidence: [*nri_operating]},
              {facet: minor, evidence: [*nri_operating, *nri_guardian]}]}
  - {category: NRI_INDIVIDUAL, account_type: RECURRING_DEPOSIT, state: COVERED, sources: [hdfc_nri_account_opening],
     evidence: [*nri_recurring],
     facets: [{facet: nri_scheme, evidence: [*nri_recurring]},
              {facet: holding, evidence: [*nri_operating]},
              {facet: minor, evidence: [*nri_operating, *nri_guardian]}]}
  - {category: NRI_INDIVIDUAL, account_type: FCNR_RFC, state: COVERED, sources: [hdfc_nri_account_opening],
     evidence: [*nri_fcnr_tick, *nri_term],
