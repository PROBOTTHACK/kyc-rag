# Source corpus manifest (docs/14). Schema: app/schemas/corpus.py::DocumentMetadata.
# Validate: python -m app.ingestion.cli validate-manifest   (run in backend/)
#
# Rules
# - Every value was checked against the PDF (data/processed/corpus_report.md). Unknown = null.
# - document_key is the logical identity; sha256 pins the exact file content. If a file's
#   bytes change, ingestion flags it for review. It never marks the old file superseded.
# - `version` holds edition text or a form print code exactly as printed. It is never a date.
# - entity_types = customer legal forms the document NAMES explicitly (docs/15). Generic text
#   ('legal entity', 'customer') adds nothing here. Residency is a separate axis.
# - evidence_eligibility is derived from document_type + source_status (not set here).
# - chunking_profile picks the Stage C chunker (docs/04): rbi_directions | rbi_faq |
#   question_headings | form.
# - Forms are `unknown`: they show what a form requests, never a current regulatory obligation.
# - bank = target-bank/project context (RBI corpus vs HDFC corpus), not necessarily the publisher;
#   the publisher is source_authority (null unless verified) and attribution_basis says how.

